{% extends "likvid/base.html" %}
{% block titel %}Log ind{% endblock %}
{% block indhold %}
<div class="login">
  <h1>Log ind</h1>
  <p class="daempet">Likviditetsstyring for Mediating og Webbler</p>
  <form method="post">{% csrf_token %}
    {% if form.errors %}<div class="besked error">Forkert brugernavn eller adgangskode.</div>{% endif %}
    <label>Brugernavn<input name="username" autofocus autocomplete="username" required></label>
    <label>Adgangskode<input type="password" name="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="knap primaer">Log ind</button>
  </form>
</div>
{% endblock %}
